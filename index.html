<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee - Pro Dark Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#0F172A',
                        cardBg: '#1E293B',
                        primary: '#6366F1',
                        primaryHover: '#4F46E5',
                        success: '#10B981',
                        error: '#F43F5E',
                        textMain: '#F8FAFC',
                        textMuted: '#94A3B8'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgMain text-textMain font-sans min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-4xl">

        <div id="view-config" class="block">
            <h1 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center sm:text-left">Configuración de Práctica</h1>
            
            <div class="bg-cardBg rounded-2xl shadow-xl p-6 sm:p-8 mb-6">
                <h2 class="text-lg sm:text-xl font-bold text-primary mb-4">1. Selecciona la Edición</h2>
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6">
                    <label class="cursor-pointer flex items-center space-x-3">
                        <input type="radio" name="lista" value="1" checked class="w-5 h-5 text-primary bg-bgMain border-gray-600 focus:ring-primary">
                        <span class="text-lg">Edición <b>2025</b></span>
                    </label>
                    <label class="cursor-pointer flex items-center space-x-3">
                        <input type="radio" name="lista" value="2" class="w-5 h-5 text-primary bg-bgMain border-gray-600 focus:ring-primary">
                        <span class="text-lg">Edición <b>2026</b></span>
                    </label>
                </div>
            </div>

            <div class="bg-cardBg rounded-2xl shadow-xl p-6 sm:p-8 mb-8">
                <div class="flex flex-col md:flex-row md:justify-between items-start md:items-center mb-6 space-y-4 md:space-y-0">
                    <h2 class="text-lg sm:text-xl font-bold text-primary">2. Selecciona las Páginas</h2>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-4 w-full md:w-auto">
                        <span id="conteo-palabras" class="text-textMuted text-sm sm:text-base">Palabras: 0</span>
                        <button id="btn-toggle-all" class="text-sm text-primary hover:text-white underline sm:no-underline transition-colors">Marcar/Desmarcar Todo</button>
                    </div>
                </div>
                <div id="paginas-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 sm:gap-4">
                    </div>
            </div>

            <button id="btn-iniciar" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg">
                Comenzar Práctica
            </button>
        </div>

        <div id="view-juego" class="hidden">
            <div class="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center mb-4 space-y-2 sm:space-y-0">
                <h2 id="lbl-info-lista" class="text-lg sm:text-xl font-bold text-primary leading-tight">Edición 2025 · Pág. 1 · #1</h2>
                <span id="lbl-progreso" class="text-base sm:text-lg text-textMuted">Progreso: 1 de 20</span>
            </div>

            <div class="w-full bg-black rounded-full h-2.5 mb-6 sm:mb-8">
                <div id="progress-bar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="bg-cardBg rounded-2xl shadow-xl p-6 sm:p-8 mb-8 min-h-[20rem] sm:min-h-[22rem] flex flex-col">
                
                <div class="h-24 sm:h-28 flex items-center justify-center w-full">
                    <h1 id="lbl-palabra" class="text-4xl sm:text-5xl md:text-6xl font-bold break-words w-full select-none">PALABRA</h1>
                </div>
                
                <div class="border-t border-slate-700/50 my-2 w-11/12 mx-auto"></div>
                
                <div class="flex-1 flex items-start justify-center pt-4 w-full overflow-y-auto">
                    <p id="lbl-desc" class="text-base sm:text-lg md:text-xl text-textMuted max-w-2xl leading-relaxed">Descripción</p>
                </div>
                
            </div>

            <div class="grid grid-cols-2 gap-4 sm:gap-8 mb-8">
                <button id="btn-incorrecto" class="bg-error hover:bg-red-600 text-white font-bold py-4 sm:py-6 rounded-xl shadow-lg transition-colors text-lg sm:text-xl flex flex-col items-center justify-center">
                    <span>Incorrecta</span>
                    <span class="text-xs sm:text-sm font-normal mt-1">[←] o [2]</span>
                </button>
                <button id="btn-correcto" class="bg-success hover:bg-green-600 text-white font-bold py-4 sm:py-6 rounded-xl shadow-lg transition-colors text-lg sm:text-xl flex flex-col items-center justify-center">
                    <span>Correcta</span>
                    <span class="text-xs sm:text-sm font-normal mt-1">[→] o [1]</span>
                </button>
            </div>

            <div class="text-center">
                <button id="btn-finalizar" class="text-textMuted hover:text-error transition-colors p-2">Finalizar Sesión</button>
            </div>
        </div>

        <div id="view-resultados" class="hidden">
            <h1 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center">Resultados de la Sesión</h1>

            <div class="bg-cardBg rounded-2xl shadow-xl p-6 sm:p-10 text-center mb-6 sm:mb-8">
                <h2 id="lbl-porcentaje" class="text-6xl sm:text-7xl font-bold text-success mb-2 sm:mb-4">0%</h2>
                <p id="lbl-detalle-score" class="text-lg sm:text-xl">Aciertos: 0 • Errores: 0</p>
            </div>

            <div id="refuerzo-container" class="mb-6 sm:mb-8 hidden">
                <h2 class="text-lg sm:text-xl font-bold text-error mb-4">Lista de Refuerzo:</h2>
                <div class="bg-cardBg rounded-xl shadow-lg overflow-x-auto">
                    <table class="w-full text-left min-w-[500px]">
                        <thead class="bg-black/50 text-textMuted">
                            <tr>
                                <th class="py-3 px-4 text-center">Lista</th>
                                <th class="py-3 px-4 text-center">Página</th>
                                <th class="py-3 px-4 text-center">Línea #</th>
                                <th class="py-3 px-4 text-center">Palabra</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-refuerzo" class="divide-y divide-gray-700">
                            </tbody>
                    </table>
                </div>
            </div>

            <button id="btn-reiniciar" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg">
                Volver al Menú
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
